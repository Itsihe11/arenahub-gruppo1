version: '3.8'

services:
  backend:
    build:
      context: ./backend/arenahub-backend
      dockerfile: Dockerfile
    image: mio-backend-springboot
    container_name: arenahub-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://aws-0-eu-west-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0
      - SPRING_DATASOURCE_USERNAME=postgres.zauqecdsvxfmrmbjcane
      - SPRING_DATASOURCE_PASSWORD=123Stella.123S
    networks:
      - arenahub-net

  frontend:
    build:
      context: ./frontend/Torneo
      dockerfile: Dockerfile
    image: arenahub-frontend
    container_name: arenahub-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - arenahub-net

networks:
  arenahub-net:
    driver: bridge
